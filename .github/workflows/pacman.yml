name: generate pacman contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12h
  workflow_dispatch: {}       # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: pacman-graph
        with:
          github_user_name: alisson-pereira-dev
          outputs: |
            pacman-contribution-graph.svg
            pacman-contribution-graph-dark.svg?palette=github-dark

      - name: push graph to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
